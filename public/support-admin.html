<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hoknex — Admin Control Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #070b14;
            --surface-1: #0f172a;
            --card-bg: #131c31;
            --border-color: rgba(148, 163, 184, 0.18);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #3b82f6;
            --accent-indigo: #6366f1;
            --accent-coral: #ef4444;
            --accent-purple: #8b5cf6;
            --accent-green: #10b981;
            --accent-amber: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: radial-gradient(circle at top right, rgba(99, 102, 241, 0.12), transparent 42%), var(--bg-color);
            color: var(--text-main);
            padding: 2rem 5% 4rem;
            max-width: 1200px;
            margin: auto;
            min-height: 100vh;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1.1rem;
        }

        .header h1 {
            font-size: 1.65rem;
            font-weight: 800;
            color: #fff;
            letter-spacing: -0.02em;
        }

        .header-sub {
            font-size: 0.82rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .back-link {
            color: #93c5fd;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.86rem;
            background: rgba(59, 130, 246, 0.12);
            border: 1px solid rgba(59, 130, 246, 0.3);
            padding: 8px 16px;
            border-radius: 10px;
            transition: 0.2s;
        }

        .back-link:hover {
            background: rgba(59, 130, 246, 0.22);
        }

        .stats-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 12px;
            margin-bottom: 1.5rem;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 14px 16px;
        }

        .stat-label {
            font-size: 0.72rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
        }

        .stat-val {
            font-size: 1.45rem;
            font-weight: 800;
            margin-top: 4px;
            color: #fff;
        }

        .toolbar-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
        }

        .tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: var(--surface-1);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            padding: 9px 18px;
            border-radius: 10px;
            transition: all 0.2s;
        }

        .tab-btn:hover {
            color: #fff;
            border-color: rgba(148, 163, 184, 0.4);
        }

        .tab-btn.active {
            background: linear-gradient(135deg, var(--accent-indigo), var(--accent-blue));
            color: #fff;
            border-color: transparent;
            box-shadow: 0 6px 18px rgba(79, 70, 229, 0.35);
        }

        .filters-wrap {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-inp, .filter-sel {
            background: var(--surface-1);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 10px;
            padding: 8px 12px;
            font-size: 0.84rem;
            font-weight: 600;
            outline: none;
        }

        .search-inp:focus, .filter-sel:focus {
            border-color: var(--accent-indigo);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .tickets-grid {
            display: grid;
            gap: 1.15rem;
        }

        .ticket-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.35rem;
            display: flex;
            flex-direction: column;
            gap: 0.9rem;
            box-shadow: 0 10px 26px rgba(0, 0, 0, 0.25);
        }

        .ticket-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .user-tag {
            background: rgba(59, 130, 246, 0.14);
            color: #93c5fd;
            padding: 4px 12px;
            border-radius: 999px;
            font-weight: 700;
            font-size: 0.82rem;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        .status-pill {
            padding: 3px 10px;
            border-radius: 999px;
            font-size: 0.72rem;
            font-weight: 800;
            text-transform: uppercase;
        }

        .status-pending {
            background: rgba(245, 158, 11, 0.15);
            color: #fbbf24;
            border: 1px solid rgba(245, 158, 11, 0.35);
        }

        .status-resolved {
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.35);
        }

        .screenshot-preview img {
            max-width: 260px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            cursor: pointer;
            margin-top: 8px;
        }

        .smart-suggest-box {
            background: rgba(99, 102, 241, 0.08);
            border: 1px solid rgba(129, 140, 248, 0.28);
            border-radius: 10px;
            padding: 9px 11px;
        }

        .smart-suggest-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 7px;
        }

        .detected-badge {
            font-size: 0.7rem;
            font-weight: 800;
            color: #c4b5fd;
            letter-spacing: 0.03em;
        }

        .autofill-btn {
            background: linear-gradient(135deg, #8b5cf6, #ec4899);
            color: #fff;
            border: none;
            border-radius: 7px;
            padding: 4px 10px;
            font-size: 0.72rem;
            font-weight: 800;
            cursor: pointer;
        }

        .quick-chips {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .quick-chip {
            background: rgba(15, 23, 42, 0.75);
            color: #e2e8f0;
            border: 1px solid rgba(148, 163, 184, 0.28);
            border-radius: 9px;
            padding: 6px 10px;
            font-size: 0.74rem;
            font-weight: 600;
            cursor: pointer;
            text-align: left;
            max-width: 100%;
        }

        .quick-chip:hover {
            border-color: #a78bfa;
            background: rgba(139, 92, 246, 0.2);
        }

        .reply-box {
            background: var(--surface-1);
            border: 1px solid var(--border-color);
            padding: 1rem;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .reply-box textarea {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 10px 12px;
            border-radius: 9px;
            color: #fff;
            outline: none;
            resize: vertical;
            font-size: 0.9rem;
            min-height: 68px;
        }

        .reply-box textarea:focus {
            border-color: var(--accent-blue);
        }

        .btn-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        .btn-reply {
            background: linear-gradient(135deg, var(--accent-indigo), var(--accent-blue));
            color: #fff;
            border: none;
            padding: 8px 15px;
            border-radius: 9px;
            font-weight: 700;
            font-size: 0.84rem;
            cursor: pointer;
        }

        .btn-delete {
            background: rgba(239, 68, 68, 0.12);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.32);
            padding: 7px 12px;
            border-radius: 9px;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .action-btn {
            background: rgba(239, 68, 68, 0.14);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.35);
            padding: 9px 12px;
            border-radius: 9px;
            font-weight: 800;
            font-size: 0.82rem;
            cursor: pointer;
            width: 100%;
            text-align: center;
        }

        .existing-reply {
            color: #86efac;
            font-size: 0.9rem;
            background: rgba(16, 185, 129, 0.08);
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px dashed rgba(16, 185, 129, 0.35);
        }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <h1>⚙️ Hoknex Admin Control</h1>
            <div class="header-sub">Support tickets, server requests &amp; event organizer approvals</div>
        </div>
        <a href="index.html" class="back-link">← Back to Main Page</a>
    </div>

    <div class="stats-bar">
        <div class="stat-card">
            <div class="stat-label">Total Tickets</div>
            <div class="stat-val" id="statTotalTickets">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Pending Replies</div>
            <div class="stat-val" id="statPendingTickets" style="color:#fbbf24;">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Resolved</div>
            <div class="stat-val" id="statResolvedTickets" style="color:#34d399;">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Organizer Apps</div>
            <div class="stat-val" id="statTotalApps" style="color:#c4b5fd;">0</div>
        </div>
    </div>

    <div class="toolbar-row">
        <div class="tabs">
            <button id="btn-tickets" class="tab-btn active" onclick="switchTab('tickets')">🎫 Support Tickets</button>
            <button id="btn-apps" class="tab-btn" onclick="switchTab('apps')">🚀 Organizer Applications</button>
        </div>
        <div class="filters-wrap">
            <input type="text" id="ticketSearchInput" class="search-inp" placeholder="Search @user or query..." oninput="renderFilteredTickets()">
            <select id="ticketStatusFilter" class="filter-sel" onchange="renderFilteredTickets()">
                <option value="all">All Status</option>
                <option value="pending">Pending Only</option>
                <option value="resolved">Resolved Only</option>
            </select>
            <button type="button" class="tab-btn" style="padding:8px 13px; font-size:0.8rem;" onclick="loadTickets(); loadApplications();">↻ Refresh</button>
        </div>
    </div>

    <div id="tab-tickets" class="tab-content active">
        <div id="ticketsContainer" class="tickets-grid">
            <p style="color: var(--text-muted);">Loading support tickets...</p>
        </div>
    </div>

    <div id="tab-apps" class="tab-content">
        <div id="adminAppList" class="tickets-grid">
            <p style="color: var(--text-muted);">Loading applications...</p>
        </div>
    </div>

    <script>
        const API_URL = 'https://hoknex-backend.onrender.com';
        let __allSupportTickets = [];
        const __ticketSuggestionsMap = {};

        const isAdminUnlocked = sessionStorage.getItem('hoknex_admin_unlocked');
        if (!isAdminUnlocked) {
            const enteredPass = prompt("🔒 SECURE HOKNEX ADMIN PORTAL\n\nEnter the Master Admin Password:");
            if (enteredPass === "kluhoknex") {
                sessionStorage.setItem('hoknex_admin_unlocked', 'true');
            } else {
                alert("⛔ ACCESS DENIED: Incorrect Master Password.");
                window.location.href = 'index.html';
            }
        }

        function escAdmin(s = '') {
            return String(s)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        // Auto-detect query intent & generate tailored reply suggestions
        function detectSmartSuggestions(ticket) {
            const rawText = String(ticket?.description || '');
            const q = rawText.toLowerCase();
            const handle = ticket?.username ? `@${String(ticket.username).replace(/^@/, '')}` : 'there';

            if (q.includes('[server deletion request]')) {
                return {
                    topic: '🗑️ Server Deletion Request',
                    suggestions: [
                        `Hi ${handle}, we've received your server deletion request and are reviewing it for safe removal.`,
                        `Hi ${handle}, your server request has been reviewed. Please confirm if you want us to proceed with permanent deletion.`
                    ]
                };
            }

            if (/\b(slow|lag|laggy|stuck|hang|freeze|loading|buffering|delay)\b/.test(q)) {
                return {
                    topic: '⚡ Performance & Speed Issue',
                    suggestions: [
                        `Hey ${handle}, sorry it felt slow! We're optimizing feed & media loading on Hoknex—try a hard refresh (Ctrl+Shift+R) and let us know if it speeds up.`,
                        `Hey ${handle}, thanks for flagging the lag! Our team is checking server/media load times so Hoknex runs much smoother for you.`
                    ]
                };
            }

            if (/\b(error|bug|crash|fail|failed|404|500|broken|issue|not working|glitch)\b/.test(q)) {
                return {
                    topic: '🛠️ Error / Bug Report',
                    suggestions: [
                        `Hey ${handle}, sorry you ran into an error! We've logged this bug and are working on a fix—share what screen you were on if it happens again.`,
                        `Hey ${handle}, thanks for reporting that error! We're investigating the root cause right now and will get it patched as soon as possible.`
                    ]
                };
            }

            if (/\b(gallery|photo|image|video|upload|camera|permission|file|dp|avatar|banner)\b/.test(q)) {
                return {
                    topic: '🖼️ Media, Gallery & Permissions',
                    suggestions: [
                        `Hey ${handle}, thanks for the feedback on media & gallery access! We're refining permission prompts and uploads so sharing feels effortless.`,
                        `Hey ${handle}, if your upload didn't go through, check browser/app media permissions and file size, then try again—our team is also improving this flow.`
                    ]
                };
            }

            if (/\b(login|log in|password|otp|email|account|sign in|wifi|ban|block)\b/.test(q)) {
                return {
                    topic: '🔐 Account & Login Help',
                    suggestions: [
                        `Hey ${handle}, if you're having trouble signing in or getting an OTP, double-check your username/email and try a fresh browser session or different network.`,
                        `Hey ${handle}, our support team is looking into your account access issue—please share your registered email or details if it's still blocked.`
                    ]
                };
            }

            if (/\b(story|stories|reel|reels|chat|message|dm|club|space|follow|notification|notif)\b/.test(q)) {
                return {
                    topic: '✨ Social Features (Stories / Chat / Clubs)',
                    suggestions: [
                        `Hey ${handle}, thanks for testing that feature on Hoknex! We're actively upgrading Stories, Spaces, and notifications to make them super smooth.`,
                        `Hey ${handle}, we noted your feedback on that feature and are rolling out improvements—keep sharing suggestions as you explore!`
                    ]
                };
            }

            return {
                topic: '💬 General Support Query',
                suggestions: [
                    `Hey ${handle}, thanks for reaching out to Hoknex Support! We've reviewed "${rawText.slice(0, 60)}${rawText.length > 60 ? '...' : ''}" and we're on it.`,
                    `Hey ${handle}, thanks for your message! Our team is looking into this and will keep improving Hoknex based on your feedback.`
                ]
            };
        }

        function switchTab(tabName) {
            document.getElementById('tab-tickets').classList.remove('active');
            document.getElementById('tab-apps').classList.remove('active');
            document.getElementById('btn-tickets').classList.remove('active');
            document.getElementById('btn-apps').classList.remove('active');

            document.getElementById(`tab-${tabName}`).classList.add('active');
            document.getElementById(`btn-${tabName}`).classList.add('active');
        }

        function applySuggestedReply(ticketId, suggestionText) {
            const ta = document.getElementById(`replyText_${ticketId}`);
            if (ta) {
                ta.value = suggestionText;
                ta.focus();
            }
        }

        function autoFillBestReply(ticketId) {
            const list = __ticketSuggestionsMap[ticketId] || [];
            if (list.length > 0) {
                applySuggestedReply(ticketId, list[0]);
            }
        }

        function updateTicketStats(tickets) {
            const total = tickets.length;
            const resolved = tickets.filter(t => Boolean(t.reply)).length;
            const pending = total - resolved;
            document.getElementById('statTotalTickets').innerText = total;
            document.getElementById('statPendingTickets').innerText = pending;
            document.getElementById('statResolvedTickets').innerText = resolved;
        }

        function renderFilteredTickets() {
            const container = document.getElementById('ticketsContainer');
            if (!container) return;

            const q = (document.getElementById('ticketSearchInput')?.value || '').trim().toLowerCase();
            const statusFilter = document.getElementById('ticketStatusFilter')?.value || 'all';

            const filtered = __allSupportTickets.filter(t => {
                const isResolved = Boolean(t.reply);
                if (statusFilter === 'pending' && isResolved) return false;
                if (statusFilter === 'resolved' && !isResolved) return false;
                if (q) {
                    const hay = `${t.username || ''} ${t.description || ''} ${t.reply || ''}`.toLowerCase();
                    if (!hay.includes(q)) return false;
                }
                return true;
            });

            if (filtered.length === 0) {
                container.innerHTML = `<div class="ticket-card"><p style="color: var(--text-muted); text-align:center;">No matching support tickets.</p></div>`;
                return;
            }

            container.innerHTML = filtered.map(t => {
                const isDeletionRequest = t.description && t.description.includes('[SERVER DELETION REQUEST]');
                const isResolved = Boolean(t.reply);
                const smart = detectSmartSuggestions(t);
                __ticketSuggestionsMap[t._id] = smart.suggestions;

                const chipsHtml = smart.suggestions.map(s => {
                    const encodedForJs = encodeURIComponent(s);
                    return `<button type="button" class="quick-chip" onclick="applySuggestedReply('${t._id}', decodeURIComponent('${encodedForJs}'))">${escAdmin(s)}</button>`;
                }).join('');

                return `
                    <div class="ticket-card">
                        <div class="ticket-header">
                            <div class="btn-row">
                                <span class="user-tag">👤 @${escAdmin(t.username || 'Student')}</span>
                                <span class="status-pill ${isResolved ? 'status-resolved' : 'status-pending'}">${isResolved ? 'Resolved' : 'Pending'}</span>
                            </div>
                            <div class="btn-row">
                                <span style="color:var(--text-muted); font-size:0.8rem;">${t.createdAt ? new Date(t.createdAt).toLocaleString() : ''}</span>
                                <button type="button" class="btn-delete" onclick="deleteTicket('${t._id}')">🗑️ Delete</button>
                            </div>
                        </div>

                        <div>
                            <p style="font-size:1rem; color:#fff; line-height:1.5;"><strong>Query:</strong> ${escAdmin(t.description || '')}</p>
                            ${t.screenshotUrl ? `
                                <div class="screenshot-preview">
                                    <p style="font-size:0.8rem; color:var(--text-muted);">Attached Screenshot:</p>
                                    <a href="${escAdmin(t.screenshotUrl)}" target="_blank"><img src="${escAdmin(t.screenshotUrl)}" alt="Support Attachment"></a>
                                </div>
                            ` : ''}
                        </div>

                        ${isDeletionRequest ? `
                            <button type="button" class="action-btn" onclick="executeSupportServerDeletion('${t._id}')">
                                🗑️ Approve &amp; Delete Server Permanently
                            </button>
                        ` : ''}

                        ${isResolved ? `
                            <div class="existing-reply"><strong>Team Reply:</strong> ${escAdmin(t.reply)}</div>
                        ` : `
                            <div class="reply-box">
                                <div class="smart-suggest-box">
                                    <div class="smart-suggest-top">
                                        <span class="detected-badge">Detected: ${escAdmin(smart.topic)}</span>
                                        <button type="button" class="autofill-btn" onclick="autoFillBestReply('${t._id}')">✨ Auto-Fill Reply</button>
                                    </div>
                                    <div class="quick-chips">${chipsHtml}</div>
                                </div>
                                <textarea id="replyText_${t._id}" rows="2" placeholder="Tap a detected suggestion above or type a custom reply..."></textarea>
                                <div class="btn-row">
                                    <button type="button" class="btn-reply" onclick="sendReply('${t._id}')">Send Reply 🚀</button>
                                </div>
                            </div>
                        `}
                    </div>
                `;
            }).join('');
        }

        async function loadTickets() {
            try {
                const res = await fetch(`${API_URL}/api/support`);
                const tickets = await res.json();
                __allSupportTickets = Array.isArray(tickets) ? tickets : [];
                updateTicketStats(__allSupportTickets);
                renderFilteredTickets();
            } catch (err) {
                document.getElementById('ticketsContainer').innerHTML = `<p style="color: #f87171;">Failed to load tickets.</p>`;
            }
        }

        async function deleteTicket(ticketId) {
            if (!confirm('Delete this support ticket?')) return;
            try {
                const res = await fetch(`${API_URL}/api/support/${ticketId}`, { method: 'DELETE' });
                if (res.ok) {
                    loadTickets();
                } else {
                    alert('Failed to delete ticket.');
                }
            } catch (_) {
                alert('Network error while deleting ticket.');
            }
        }

        async function executeSupportServerDeletion(ticketId) {
            if (!confirm('Approve this request and permanently delete this server?')) return;
            try {
                const res = await fetch(`${API_URL}/api/support/delete-server-by-ticket/${ticketId}`, { method: 'DELETE' });
                if (res.ok) {
                    alert('Server successfully deleted by support team!');
                    loadTickets();
                } else {
                    alert('Failed to delete server.');
                }
            } catch (e) {
                alert('Network error during deletion.');
            }
        }

        async function sendReply(id) {
            const reply = document.getElementById(`replyText_${id}`).value.trim();
            if (!reply) return alert('Please type a reply first!');
            try {
                const res = await fetch(`${API_URL}/api/support/${id}/reply`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ reply })
                });
                if (res.ok) {
                    alert('Reply sent successfully!');
                    loadTickets();
                } else {
                    const errData = await res.json().catch(() => ({}));
                    alert(errData.error || 'Failed to send reply.');
                }
            } catch (err) {
                alert('Network error.');
            }
        }

        async function loadApplications() {
            const container = document.getElementById('adminAppList');
            try {
                const res = await fetch(`${API_URL}/api/applications`);
                const apps = await res.json();
                const list = Array.isArray(apps) ? apps : [];
                document.getElementById('statTotalApps').innerText = list.length;

                if (list.length === 0) {
                    container.innerHTML = `<div class="ticket-card"><p style="text-align:center; color:var(--text-muted);">No pending applications.</p></div>`;
                    return;
                }

                container.innerHTML = list.map(app => `
                    <div class="ticket-card" style="background:${app.status === 'approved' ? 'rgba(16,185,129,0.06)' : 'var(--card-bg)'};">
                        <div style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:10px;">
                            <div>
                                <h4 style="margin:0 0 5px 0; color:#fff; font-size:1.1rem;">👤 ${escAdmin(app.username || '')}</h4>
                                <p style="margin:0 0 8px 0; font-size:0.9rem; font-weight:700; color:#c4b5fd;">🏫 ${escAdmin(app.organization || '')}</p>
                                <p style="margin:0 0 12px 0; font-size:0.88rem; color:var(--text-muted); line-height:1.5;">${escAdmin(app.description || '')}</p>
                                <span style="font-size:0.74rem; font-weight:800; padding:4px 10px; border-radius:6px; background:${app.status === 'approved' ? 'var(--accent-green)' : '#f59e0b'}; color:#fff;">
                                    STATUS: ${escAdmin((app.status || 'pending').toUpperCase())}
                                </span>
                            </div>
                            ${app.status === 'pending' ? `<button type="button" class="btn-reply" style="background:var(--accent-purple);" onclick="approveApp('${app._id}')">Approve ✅</button>` : ''}
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                container.innerHTML = `<p style="color:#f87171;">Failed to load applications.</p>`;
            }
        }

        async function approveApp(appId) {
            if (!confirm('Approve this user to host events on Hoknex?')) return;
            try {
                const res = await fetch(`${API_URL}/api/applications/${appId}/approve`, { method: 'PUT' });
                if (res.ok) {
                    alert("✅ Organizer Approved! They can now host events.");
                    loadApplications();
                } else {
                    alert("Failed to approve application.");
                }
            } catch (err) {
                alert("Network error.");
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            if (sessionStorage.getItem('hoknex_admin_unlocked')) {
                loadTickets();
                loadApplications();
            }
        });
    </script>
</body>
</html>
