<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hoknex — Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Unified Color Palette */
            --bg-color: #0b0f19;
            --card-bg: #1e293b;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #3b82f6;
            --accent-coral: #ef4444;
            --accent-purple: #8b5cf6;
            --accent-green: #10b981;
            
            /* Mapping variables used in JS templates */
            --canvas: var(--card-bg);
            --border: var(--border-color);
            --ink: var(--text-main);
            --ink-light: var(--text-muted);
            --background: var(--bg-color);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 3rem 5%; max-width: 1200px; margin: auto; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; border-bottom: 1px solid var(--border-color); padding-bottom: 1rem; }
        .header h1 { font-size: 1.8rem; font-weight: 800; color: #fff; }
        .back-link { color: var(--accent-blue); text-decoration: none; font-weight: 600; background: rgba(59, 130, 246, 0.1); padding: 8px 16px; border-radius: 8px; transition: 0.2s;}
        .back-link:hover { background: rgba(59, 130, 246, 0.2); }

        /* Admin Tabs UI */
        .tabs { display: flex; gap: 15px; margin-bottom: 2rem; border-bottom: 1px solid var(--border-color); padding-bottom: 15px; }
        .tab-btn { background: transparent; color: var(--text-muted); border: none; font-size: 1.1rem; font-weight: 700; cursor: pointer; padding: 10px 20px; border-radius: 8px; transition: all 0.2s; }
        .tab-btn:hover { background: rgba(255,255,255,0.05); }
        .tab-btn.active { background: var(--accent-blue); color: #fff; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .tickets-grid { display: grid; gap: 1.5rem; }
        .ticket-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; }
        
        .ticket-header { display: flex; justify-content: space-between; align-items: center; }
        .user-tag { background: rgba(59, 130, 246, 0.1); color: var(--accent-blue); padding: 4px 12px; border-radius: 20px; font-weight: 700; font-size: 0.85rem; border: 1px solid rgba(59, 130, 246, 0.3); }
        
        .screenshot-preview img { max-width: 250px; border-radius: 8px; border: 1px solid var(--border-color); cursor: pointer; transition: transform 0.2s; margin-top:10px; }
        .screenshot-preview img:hover { transform: scale(1.02); }

        .reply-box { background: #0f172a; border: 1px solid var(--border-color); padding: 1.25rem; border-radius: 12px; margin-top: 0.5rem; display: flex; flex-direction: column; gap: 10px; }
        .reply-box textarea { background: #1e293b; border: 1px solid var(--border-color); padding: 10px; border-radius: 8px; color: #fff; outline: none; resize: vertical; font-size: 0.95rem; }
        .reply-box textarea:focus { border-color: var(--accent-blue); }
        
        .btn-reply { background: var(--accent-blue); color: #fff; border: none; padding: 10px 16px; border-radius: 8px; font-weight: 700; cursor: pointer; width: fit-content; }
        .action-btn { background: rgba(239, 68, 68, 0.1); color: var(--accent-coral); border: 1px solid rgba(239, 68, 68, 0.3); padding: 10px; border-radius: 8px; font-weight: 800; cursor: pointer; width: 100%; text-align: center; }
        
        .resolved-badge { background: rgba(34, 197, 94, 0.1); color: #22c55e; padding: 4px 10px; border-radius: 6px; font-size: 0.8rem; font-weight: 700; border: 1px solid rgba(34, 197, 94, 0.3); width: fit-content; }
        .existing-reply { color: #86efac; font-size: 0.95rem; background: rgba(34, 197, 94, 0.05); padding: 10px; border-radius: 8px; border: 1px dashed rgba(34, 197, 94, 0.2); }
    </style>
</head>
<body>

    <div class="header">
        <h1>⚙️ Hoknex Admin Control</h1>
        <a href="index.html" class="back-link">← Back to Main Page</a>
    </div>

    <!-- UI TABS -->
    <div class="tabs">
        <button id="btn-tickets" class="tab-btn active" onclick="switchTab('tickets')">🎫 Support Tickets</button>
        <button id="btn-apps" class="tab-btn" onclick="switchTab('apps')">🚀 Organizer Applications</button>
    </div>

    <!-- TAB 1: SUPPORT TICKETS -->
    <div id="tab-tickets" class="tab-content active">
        <div id="ticketsContainer" class="tickets-grid">
            <p style="color: var(--text-muted);">Loading support tickets...</p>
        </div>
    </div>

    <!-- TAB 2: ORGANIZER APPLICATIONS -->
    <div id="tab-apps" class="tab-content">
        <div id="adminAppList" class="tickets-grid">
            <p style="color: var(--text-muted);">Loading applications...</p>
        </div>
    </div>

    <!-- ALL JAVASCRIPT LOGIC -->
    <script>
        // --- 1. STANDALONE ADMIN SECURITY LOCK (Runs Immediately) ---
        // Set your master admin password here (do not share this!)
        const MASTER_ADMIN_PASSWORD = "HoknexAdmin2026!"; 
        
        // We use sessionStorage so you don't have to re-enter it every time you refresh,
        // but it strictly locks again as soon as the browser tab is closed.
        let isAdminUnlocked = sessionStorage.getItem('hoknex_admin_unlocked');

        if (!isAdminUnlocked) {
            // Prompt for the standalone password
            const enteredPass = prompt("🔒 SECURE HOKNEX ADMIN PORTAL\n\nEnter the Master Admin Password:");

            if (enteredPass === "kluhoknex") {
                sessionStorage.setItem('hoknex_admin_unlocked', 'true');
            } else {
                alert("⛔ ACCESS DENIED: Incorrect Master Password.");
                window.location.href = 'index.html'; // Kicks unauthorized users away
            }
        }

        // --- 2. UI TAB SWITCHER ---
        function switchTab(tabName) {
            // Hide all contents
            document.getElementById('tab-tickets').classList.remove('active');
            document.getElementById('tab-apps').classList.remove('active');
            // Remove active state from all buttons
            document.getElementById('btn-tickets').classList.remove('active');
            document.getElementById('btn-apps').classList.remove('active');

            // Show selected
            document.getElementById(`tab-${tabName}`).classList.add('active');
            document.getElementById(`btn-${tabName}`).classList.add('active');
        }

        // --- 3. SUPPORT TICKETS LOGIC ---
        async function loadTickets() {
            try {
                const res = await fetch('/api/support');
                const tickets = await res.json();
                const container = document.getElementById('ticketsContainer');

                if(tickets.length === 0) {
                    container.innerHTML = `<div class="ticket-card"><p style="color: var(--text-muted); text-align:center;">No support queries submitted yet.</p></div>`;
                    return;
                }

                container.innerHTML = tickets.map(t => {
                    const isDeletionRequest = t.description && t.description.includes('[SERVER DELETION REQUEST]');
                    return `
                        <div class="ticket-card">
                            <div class="ticket-header">
                                <span class="user-tag">👤 @${t.username || 'Student'}</span>
                                <span style="color:var(--text-muted); font-size:0.85rem;">${new Date(t.createdAt).toLocaleString()}</span>
                            </div>
                            <div>
                                <p style="font-size:1.05rem; color:#fff;"><strong>Query:</strong> ${t.description}</p>
                                ${t.screenshotUrl ? `
                                    <div class="screenshot-preview">
                                        <p style="font-size:0.85rem; color:var(--text-muted); margin-bottom:5px;">Attached Screenshot:</p>
                                        <a href="${t.screenshotUrl}" target="_blank"><img src="${t.screenshotUrl}" alt="Support Attachment"></a>
                                    </div>
                                ` : ''}
                            </div>
                            ${isDeletionRequest ? `
                                <button class="action-btn" onclick="executeSupportServerDeletion('${t._id}')">
                                    🗑️ Approve & Delete Server Permanently
                                </button>
                            ` : ''}
                            ${t.reply ? `
                                <div class="existing-reply"><strong>Team Reply:</strong> ${t.reply}</div>
                                <span class="resolved-badge">Status: Resolved</span>
                            ` : `
                                <div class="reply-box">
                                    <textarea id="replyText_${t._id}" rows="2" placeholder="Write a reply to this student..."></textarea>
                                    <button class="btn-reply" onclick="sendReply('${t._id}')">Send Reply 🚀</button>
                                </div>
                            `}
                        </div>
                    `;
                }).join('');
            } catch(err) {
                document.getElementById('ticketsContainer').innerHTML = `<p style="color: #f87171;">Failed to load tickets.</p>`;
            }
        }

        async function executeSupportServerDeletion(ticketId) {
            if (!confirm('Are you sure you want to approve this request and permanently delete this server?')) return;
            try {
                const res = await fetch(`/api/support/delete-server-by-ticket/${ticketId}`, { method: 'DELETE' });
                if (res.ok) {
                    alert('Server successfully deleted by support team!');
                    loadTickets(); 
                } else {
                    alert('Failed to delete server.');
                }
            } catch (e) { alert('Network error during deletion.'); }
        }

        async function sendReply(id) {
            const reply = document.getElementById(`replyText_${id}`).value.trim();
            if(!reply) return alert('Please type a reply first!');
            try {
                const res = await fetch(`/api/support/${id}/reply`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ reply })
                });
                if(res.ok) {
                    alert('Reply sent successfully!');
                    loadTickets();
                } else { alert('Failed to send reply.'); }
            } catch(err) { alert('Network error.'); }
        }

        // --- 4. ORGANIZER APPLICATIONS LOGIC ---
        async function loadApplications() {
            const container = document.getElementById('adminAppList');
            try {
                const res = await fetch('/api/applications');
                const apps = await res.json();
                
                if (apps.length === 0) {
                    container.innerHTML = `<div class="ticket-card"><p style="text-align:center; color:var(--text-muted);">No pending applications.</p></div>`;
                    return;
                }

                container.innerHTML = apps.map(app => `
                    <div class="ticket-card" style="background:${app.status === 'approved' ? 'rgba(52,211,153,0.05)' : 'var(--card-bg)'};">
                        <div style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:10px;">
                            <div>
                                <h4 style="margin:0 0 5px 0; color:#fff; font-size:1.2rem;">👤 ${app.username}</h4>
                                <p style="margin:0 0 10px 0; font-size:0.95rem; font-weight:700; color:var(--accent-purple);">🏫 ${app.organization}</p>
                                <p style="margin:0 0 15px 0; font-size:0.95rem; color:var(--text-muted); line-height:1.5;">${app.description}</p>
                                <span style="font-size:0.8rem; font-weight:800; padding:4px 10px; border-radius:6px; background:${app.status === 'approved' ? 'var(--accent-green)' : '#f59e0b'}; color:#fff;">
                                    STATUS: ${app.status.toUpperCase()}
                                </span>
                            </div>
                            ${app.status === 'pending' ? `<button class="btn-reply" style="background:var(--accent-purple);" onclick="approveApp('${app._id}')">Approve ✅</button>` : ''}
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                container.innerHTML = `<p style="color:red;">Failed to load applications.</p>`;
            }
        }

        async function approveApp(appId) {
            if (!confirm('Approve this user to host events on Hoknex?')) return;
            try {
                const res = await fetch(`/api/applications/${appId}/approve`, { method: 'PUT' });
                if (res.ok) {
                    alert("✅ Organizer Approved! They can now host events.");
                    loadApplications(); // Refresh the list
                } else { alert("Failed to approve application."); }
            } catch (err) { alert("Network error."); }
        }

        // --- 5. INITIALIZE DASHBOARD ---
        window.addEventListener('DOMContentLoaded', () => {
            // Only load data if the vault is unlocked!
            if (sessionStorage.getItem('hoknex_admin_unlocked')) {
                loadTickets();
                loadApplications();
            }
        });
    </script>
</body>
</html>
